version: '3.8'

services:
  # MySQL 8.4 Production Database
  mysql:
    image: mysql:8.4
    container_name: lexora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperPassword123!
      MYSQL_DATABASE: lexora
      MYSQL_USER: lexora_user
      MYSQL_PASSWORD: LexoraPass123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=300
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "lexora_user", "-pLexoraPass123!"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lexora-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_MODE: normal
      PORT: 5000
      DATABASE_URL: "mysql://lexora_user:LexoraPass123!@mysql:3306/lexora"
      JWT_SECRET: "lexora_enterprise_super_secure_jwt_token_2026_antigravity"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost"
      UPLOAD_DIR: "/app/storage/uploads"
    volumes:
      - uploads_data:/app/storage/uploads
    ports:
      - "5000:5000"

  # Angular Frontend (Nginx Reverse Proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lexora-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

